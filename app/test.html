<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heroku | Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #6f42c1, #563d7c);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    .logo h1 {
      color: white;
      font-weight: 500;
      font-size: 22px;
      margin-top: 10px;
    }

    .go-link {
      color: #d9c2ff;
      margin-bottom: 25px;
      text-decoration: none;
      font-size: 14px;
    }

    .go-link:hover {
      text-decoration: underline;
    }

    .login-box {
      background: white;
      width: 360px;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      padding: 40px 30px;
      text-align: center;
    }

    .login-box h2 {
      color: #563d7c;
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 14px;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #6f42c1;
    }

    .btn {
      width: 100%;
      background: linear-gradient(180deg, #7a4ce0, #623bb2);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(180deg, #8351e8, #693ebf);
    }

    .signup {
      margin-top: 20px;
      font-size: 14px;
    }

    .signup a {
      color: #6f42c1;
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .links {
      margin-top: 15px;
      font-size: 13px;
    }

    .links a {
      color: #6f42c1;
      text-decoration: none;
      margin: 0 5px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 40px;
      color: #e0d1ff;
      font-size: 12px;
      text-align: center;
    }

    footer a {
      color: #e0d1ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .salesforce {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .salesforce img {
      height: 25px;
      margin-left: 6px;
    }

    @media (max-width: 420px) {
      .login-box {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="logo">
    <!-- Heroku logo (SVG) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="15%" fill="#79589f"/>
      <path fill="white" d="M127 97v318h257V97Zm209 218c-7 0-18 4-26 11-18 15-30 21-47 21-27 0-43-17-46-49 2-50 31-82 78-82 28 0 47 13 47 35 0 13-7 26-20 37-12 9-27 15-38 15-5 0-10-1-13-3-3-2-4-4-4-7 0-2 1-5 3-8 2-2 3-4 3-5 0-2-1-3-4-3-9 0-20 11-20 25 0 12 9 19 24 19 21 0 49-12 66-30 15-15 23-34 23-54 0-33-24-56-64-56-28 0-53 11-71 32-19 20-29 47-29 77 0 44 27 71 70 71 18 0 33-4 49-13 9-6 18-13 24-20 2-3 4-4 7-4 4 0 7 3 7 7v13c-1 1-1 2-1 3-1 2-4 6-8 9-14 13-38 22-61 22-56 0-91-35-91-92 0-29 11-55 32-75s47-30 79-30c45 0 75 26 75 67 0 26-13 49-36 68-19 16-46 26-70 26Z"/>
    </svg>
    <h1>HEROKU</h1>
  </div>

  <a href="#" class="go-link">Go to heroku.com</a>

  <div class="login-box">
    <h2>Log in to your account</h2>
    <form>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="Email address" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" />

      <button type="button" class="btn">Log In</button>
    </form>

    <div class="signup">
      New to Heroku? <a href="#">Sign Up</a>
    </div>

    <div class="links">
      <a href="#">Log in via SSO</a> | 
      <a href="#">Forgot your password?</a>
    </div>
  </div>

  <footer>
    <div class="salesforce">
      HEROKU IS A <img src="https://upload.wikimedia.org/wikipedia/commons/2/27/Salesforce_logo.svg" alt="Salesforce logo"> COMPANY
    </div>
    <div style="margin-top:8px;">
      <a href="#">Terms of Service</a> • 
      <a href="#">Privacy</a> • 
      <a href="#">Cookies</a> • 
      <a href="#">Cookie Preferences</a>
    </div>
  </footer>

</body>
</html>
