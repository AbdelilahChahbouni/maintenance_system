{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 mt-4">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-danger text-white rounded-top-4 d-flex align-items-center justify-content-between">
            <h4 class="mb-0"><i class="fas fa-user-times me-2"></i> Delete User</h4>
            <a href="{{ url_for('auth.list_users') }}" class="btn btn-light btn-sm fw-semibold">
                <i class="fas fa-arrow-left me-1"></i> Back
            </a>
        </div>

        <div class="card-body px-5 py-4">
            <form method="POST">
                {{ form.hidden_tag() }}
                
                <div class="mb-4">
                    <label class="form-label fw-bold">{{ form.user.label }}</label>
                    {{ form.user(class="form-select rounded-3 shadow-sm") }}
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-danger px-4 py-2 rounded-3 fw-semibold">
                        <i class="fas fa-trash-alt me-2"></i> Delete User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
