{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-4 mt-4">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white rounded-top-4 d-flex align-items-center justify-content-between">
            <h4 class="mb-0"><i class="fas fa-user-shield me-2"></i> Manage User Status</h4>
            <a href="{{ url_for('auth.list_users') }}" class="btn btn-light btn-sm fw-semibold">
                <i class="fas fa-arrow-left me-1"></i> Back
            </a>
        </div>

        <div class="card-body px-5 py-4">
            <form method="POST">
                {{ form.hidden_tag() }}

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">{{ form.user.label }}</label>
                        {{ form.user(class="form-select rounded-3 shadow-sm") }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">{{ form.status.label }}</label>
                        {{ form.status(class="form-select rounded-3 shadow-sm") }}
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4 py-2 rounded-3 fw-semibold">
                        <i class="fas fa-save me-2"></i> Update Status
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
