<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Blocked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f2f5, #d9e4f5);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blocked-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .blocked-icon {
            font-size: 70px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        h2 {
            color: #dc3545;
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            text-decoration: none;
            color: #fff;
            background: #007bff;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="blocked-card">
        <div class="blocked-icon">🔒</div>
        <h2>Account Blocked</h2>
        <p>Your account is currently <strong>inactive</strong>.<br>
        Please wait until an administrator activates your account.</p>
        <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </div>
</body>
</html>
